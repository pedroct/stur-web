# Configuração do SonarQube. O token NÃO fica aqui (repositório público):
# use a variável SONAR_TOKEN_WEB (veja scripts/sonar.sh).
sonar.host.url=https://sonar.pedroct.com.br
sonar.projectKey=stur-consulta-web
sonar.projectName=stur-consulta-web

sonar.sources=src
sonar.tests=tests

# Gerado por: pnpm test:cobertura
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Tipos gerados a partir do contrato da stur-api (pnpm contrato): fora da análise e da duplicação
sonar.exclusions=src/contrato/schema.d.ts,src/contrato/openapi.json
sonar.cpd.exclusions=src/contrato/schema.d.ts,src/contrato/openapi.json

# Falsos positivos aceitos:
# e1: o & do @custom-variant é sintaxe do Tailwind v4 (o alvo da variante), não um aninhamento solto.
# e2: a caixa da tela 13 anuncia o título e a mensagem e leva links; <output> só aceita texto
#     (conteúdo de frase), então o quadro fica com role="status".
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.e1.resourceKey=src/app/globals.css
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e2.resourceKey=src/componentes/estados/NenhumaVenda.tsx
